name: Refresh dashboard data

# This workflow only refreshes data.json and pushes it back to the repo.
# GitHub Pages (once enabled to serve from the main branch — see README) picks up the
# change automatically within a minute or two. No separate deploy step needed.

on:
  schedule:
    # 10:30 IST daily. IST is UTC+5:30, and GitHub Actions cron always runs in UTC, so 10:30 IST
    # = 05:00 UTC. If you ever need a different time, subtract 5 hours 30 minutes from the IST
    # time you want and express that in UTC here.
    - cron: '0 5 * * *'
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab, any time

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh data.json from Windsor.ai
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/refresh_data.py

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name "facet-auto-refresh"
          git config user.email "actions@github.com"
          if git diff --quiet -- data.json; then
            echo "No data changes — skipping commit."
          else
            git add data.json
            git commit -m "Auto-refresh dashboard data [skip ci]"
            git push
          fi
